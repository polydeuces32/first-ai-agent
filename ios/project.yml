name: EvidenceOS
options:
  bundleIdPrefix: com.evidenceos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.evidenceos.app
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    INFOPLIST_FILE: EvidenceOS/Info.plist
targets:
  EvidenceOS:
    type: application
    platform: iOS
    sources:
      - EvidenceOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
