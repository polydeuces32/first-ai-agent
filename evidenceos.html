<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvidenceOS | Document Intelligence</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f17;
      color: #e8eefc;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 42px;
    }

    p {
      color: #aab6cc;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 28px;
    }

    .card {
      background: #121826;
      border: 1px solid #263247;
      border-radius: 14px;
      padding: 20px;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #33415c;
      padding: 12px;
      font-size: 15px;
    }

    input, textarea {
      background: #0b0f17;
      color: #e8eefc;
    }

    button {
      background: #4f8cff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    pre {
      white-space: pre-wrap;
      background: #080b11;
      border: 1px solid #263247;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      color: #cfe0ff;
      min-height: 120px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .status {
      margin-top: 16px;
      color: #8bd49c;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>EvidenceOS</h1>
    <p>
      Evidence verified document intelligence. Upload a document, ask questions,
      generate a risk review, and inspect cited source evidence.
    </p>

    <div class="status" id="status">Backend: checking...</div>

    <div class="grid">
      <section class="card">
        <h2>1. Upload Document</h2>
        <input id="fileInput" type="file" />
        <button onclick="uploadDocument()">Upload</button>
        <p>Current Document ID:</p>
        <pre id="documentId">None</pre>
      </section>

      <section class="card">
        <h2>2. Ask Question</h2>
        <textarea id="questionInput" rows="5">What are the payment and renewal risks?</textarea>
        <button onclick="askDocument()">Ask</button>
      </section>

      <section class="card">
        <h2>3. Review Document</h2>
        <textarea id="focusInput" rows="5">payment terms, renewal, termination, liability, and missing evidence</textarea>
        <button onclick="reviewDocument()">Generate Review</button>
      </section>

      <section class="card">
        <h2>4. Smoke Evals</h2>
        <button onclick="runSmokeEvals()">Run Smoke Evals</button>
      </section>

      <section class="card full">
        <h2>Output</h2>
        <pre id="output">Waiting...</pre>
      </section>
    </div>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    let currentDocumentId = null;

    function show(data) {
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    }

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        document.getElementById("status").textContent = `Backend: ${data.status}`;
      } catch (err) {
        document.getElementById("status").textContent = "Backend: offline";
      }
    }

    async function uploadDocument() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        show({ error: "Choose a file first." });
        return;
      }

      const form = new FormData();
      form.append("file", file);

      const res = await fetch(`${API_BASE}/documents/upload`, {
        method: "POST",
        body: form
      });

      const data = await res.json();
      if (data.id) {
        currentDocumentId = data.id;
        document.getElementById("documentId").textContent = data.id;
      }
      show(data);
    }

    async function askDocument() {
      if (!currentDocumentId) {
        show({ error: "Upload a document first." });
        return;
      }

      const question = document.getElementById("questionInput").value;

      const res = await fetch(`${API_BASE}/documents/${currentDocumentId}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      show(await res.json());
    }

    async function reviewDocument() {
      if (!currentDocumentId) {
        show({ error: "Upload a document first." });
        return;
      }

      const focus = document.getElementById("focusInput").value;

      const res = await fetch(`${API_BASE}/documents/${currentDocumentId}/review`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ focus })
      });

      show(await res.json());
    }

    async function runSmokeEvals() {
      const res = await fetch(`${API_BASE}/evals/smoke`);
      show(await res.json());
    }

    checkHealth();
  </script>
</body>
</html>
