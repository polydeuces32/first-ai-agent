services:
  - type: web
    name: evidenceos
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: Dockerfile
    disk:
      name: evidenceos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: DATABASE_URL
        fromDatabase:
          name: evidenceos-db
          property: connectionString

databases:
  - name: evidenceos-db
    plan: starter
    databaseName: evidenceos
    user: evidenceos
